<div class="min-h-screen">
  <!-- Header -->
  <header class="bg-black border-b border-gray-800 shadow-sm sticky top-0 z-50 overflow-hidden">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 overflow-hidden">
        <div class="flex items-center space-x-4">
          <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-800 transition-colors lg:hidden">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <div class="flex items-center space-x-3">
            <!-- Property Portal Icon -->
            <div class="w-9 h-9 rounded-lg bg-yellow-400 flex items-center justify-center shadow-md">
              <svg class="w-5 h-5 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              </svg>
            </div>
            <div class="flex flex-col">
              <span class="text-lg font-bold text-white">Property Portal</span>
              <span class="text-xs text-gray-400">Property Sale Purchase Rent Portal</span>
            </div>
          </div>
        </div>
        
        <div class="flex items-center space-x-4 overflow-hidden">
          <!-- Add Property Button and Pointing Icon (only on dashboard) -->
          <div *ngIf="isDashboardRoute" class="flex items-center space-x-3 relative mr-2 overflow-visible">
            <!-- Animated Message -->
            <div class="hidden md:flex items-center space-x-2 px-4 py-2 bg-gradient-to-r from-purple-500 via-pink-500 to-orange-500 rounded-lg shadow-lg animate-pulse relative overflow-hidden group">
              <span class="absolute inset-0 bg-white opacity-20 animate-ping"></span>
              <div class="relative flex items-center space-x-2">
                <svg class="w-5 h-5 text-white animate-bounce" style="animation-duration: 1.5s;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
                <span class="text-white text-xs font-bold uppercase tracking-wide whitespace-nowrap">
                  Looking for <span class="bg-white/30 px-1.5 py-0.5 rounded font-extrabold">Buyer</span> or <span class="bg-white/30 px-1.5 py-0.5 rounded font-extrabold">Tenant</span>?
                </span>
              </div>
            </div>
            
            <!-- Pointing Hand Icon -->
            <div class="relative animate-bounce" style="animation-duration: 2s; animation-iteration-count: infinite;">
              <div class="text-2xl transform -scale-x-100">👋</div>
              <!-- Pointing Arrow -->
              <div class="absolute -right-2 top-1/2 transform -translate-y-1/2 animate-pulse">
                <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M8 5v14l11-7z"/>
                </svg>
              </div>
            </div>
            <button
              (click)="navigateToCreateProperty()"
              class="px-3 py-1.5 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white rounded-lg transition-all duration-200 font-semibold text-xs uppercase tracking-wide shadow-lg hover:shadow-xl flex items-center space-x-1.5 transform hover:scale-105 relative z-10"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
              </svg>
              <span>Add Property</span>
            </button>
          </div>
          
          <button class="p-2 rounded-lg hover:bg-gray-800 transition-colors relative">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>
          <div class="relative flex items-center space-x-3 pl-4 border-l border-gray-800">
            <!-- User Menu Button -->
            <button 
              (click)="toggleUserMenu()"
              class="flex items-center space-x-3 hover:bg-gray-800 rounded-lg px-2 py-1.5 transition-colors"
            >
              <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white font-semibold text-sm">
                {{ getUserInitials() }}
              </div>
              <div class="hidden sm:block text-left">
                <div class="text-sm font-medium text-white">{{ getUserName() }}</div>
                <div *ngIf="getUserEmail()" class="text-xs text-gray-400">{{ getUserEmail() }}</div>
              </div>
              <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
              </svg>
            </button>

            <!-- User Dropdown Menu -->
            <div 
              *ngIf="userMenuOpen && isLoggedIn()"
              class="absolute right-0 top-full mt-2 w-56 bg-white rounded-xl shadow-lg border border-gray-200 py-2 z-50"
            >
              <div class="px-4 py-3 border-b border-gray-200">
                <div class="text-sm font-medium text-gray-900">{{ getUserName() }}</div>
                <div *ngIf="getUserEmail()" class="text-xs text-gray-500 mt-1">{{ getUserEmail() }}</div>
              </div>
              
              <div class="py-1">
                <a routerLink="/settings" (click)="closeUserMenu()" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors">
                  <svg class="w-4 h-4 mr-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  </svg>
                  Settings
                </a>
              </div>
              
              <div class="border-t border-gray-200 py-1">
                <button 
                  (click)="logout()"
                  class="flex items-center w-full px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors"
                >
                  <svg class="w-4 h-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                  </svg>
                  <span>Logout</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Click outside to close menu -->
          <div 
            *ngIf="userMenuOpen"
            (click)="closeUserMenu()"
            class="fixed inset-0 z-40"
            style="top: 4rem;"
          ></div>
        </div>
      </div>
    </div>
  </header>

  <div class="flex min-h-[calc(100vh-4rem)] property-background relative">
    <!-- Sidebar -->
    <aside [class]="'bg-white/60 backdrop-blur-md border-r border-gray-200/50 shadow-sm transition-all duration-300 ' + (sidebarOpen ? 'w-64' : '-ml-64 lg:ml-0') + ' fixed lg:static h-[calc(100vh-4rem)] overflow-y-auto z-40'">
      <div class="p-4">
        <div class="mb-6">
          <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider px-3 mb-3">Navigation</h3>
          <nav class="space-y-0.5">
            <ng-container *ngFor="let item of menuItems">
              <a *ngIf="item.link !== '/logout'"
                 [routerLink]="item.link" 
                 routerLinkActive="bg-black text-white border-r-2 border-black"
                 [routerLinkActiveOptions]="{exact: item.link === '/'}"
                 class="flex items-center space-x-2.5 px-3 py-2 rounded-md text-sm text-gray-700 hover:bg-gray-50 hover:text-black transition-all duration-200 group font-medium">
                <span class="text-base">{{ item.icon }}</span>
                <span>{{ item.title }}</span>
              </a>
              <button *ngIf="item.link === '/logout'"
                      (click)="logout()"
                      class="flex items-center w-full space-x-2.5 px-3 py-2 rounded-md text-sm text-gray-700 hover:bg-gray-50 hover:text-black transition-all duration-200 group font-medium">
                <span class="text-base">{{ item.icon }}</span>
                <span>{{ item.title }}</span>
              </button>
            </ng-container>
          </nav>
        </div>
      </div>
    </aside>

    <!-- Sidebar overlay for mobile -->
    <div *ngIf="sidebarOpen" 
         (click)="toggleSidebar()"
         class="fixed inset-0 bg-black/50 z-30 lg:hidden"
         style="top: 4rem;"></div>

    <!-- Main Content -->
    <main class="flex-1 p-4 lg:p-6 relative z-10">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Logout Confirmation Dialog -->
  <div 
    *ngIf="showLogoutDialog"
    class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4"
    (click)="cancelLogout()"
  >
    <div 
      class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center mb-4">
        <div class="w-10 h-10 rounded-full bg-yellow-100 flex items-center justify-center mr-3">
          <svg class="w-6 h-6 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-900">Confirm Logout</h3>
        <button 
          (click)="cancelLogout()"
          class="ml-auto text-gray-400 hover:text-gray-600 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      
      <p class="text-gray-600 mb-6">Are you sure you want to logout?</p>
      
      <div class="flex justify-end space-x-3">
        <button 
          (click)="cancelLogout()"
          class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors font-medium"
        >
          No
        </button>
        <button 
          (click)="confirmLogout()"
          class="px-4 py-2 text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors font-medium"
        >
          Yes
        </button>
      </div>
    </div>
  </div>
</div>
