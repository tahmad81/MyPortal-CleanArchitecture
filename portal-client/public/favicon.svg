<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="portalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded square -->
  <rect x="5" y="5" width="90" height="90" rx="18" fill="url(#portalGradient)"/>
  
  <!-- Property/Building Icon -->
  <g transform="translate(50, 50)">
    <!-- Building 1 (left) -->
    <rect x="-28" y="-10" width="16" height="20" 
          rx="2" 
          fill="white" 
          opacity="0.95"/>
    <rect x="-26" y="-6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="-20" y="-6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="-26" y="2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="-20" y="2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    
    <!-- Building 2 (center - tallest) -->
    <rect x="-8" y="-18" width="16" height="28" 
          rx="2" 
          fill="white"/>
    <rect x="-6" y="-14" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="0" y="-14" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="-6" y="-6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="0" y="-6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="-6" y="2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="0" y="2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    
    <!-- Building 3 (right) -->
    <rect x="12" y="-6" width="16" height="16" 
          rx="2" 
          fill="white" 
          opacity="0.95"/>
    <rect x="14" y="-2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="20" y="-2" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="14" y="6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    <rect x="20" y="6" width="4" height="4" rx="0.5" fill="url(#portalGradient)" opacity="0.8"/>
    
    <!-- Door on center building -->
    <rect x="-3" y="6" width="6" height="4" 
          rx="1" 
          fill="url(#portalGradient)"/>
  </g>
</svg>
